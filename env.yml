name: ihec-as
channels:
  - conda-forge
  - bioconda
dependencies:
  # ── Bioinformatics tools ─────────────────────────────────────────────────
  - suppa=2.3
  - samtools=1.23.1
  - ucsc-bigwigaverageoverbed=482
  - maxentscan=0_2004.04.21

  # ── Runtime ──────────────────────────────────────────────────────────────
  - python=3.14.3
  - ca-certificates=2026.2.25
  - openssl=3.6.1

  # ── ML / data science ────────────────────────────────────────────────────
  - numpy=2.4.3
  - scikit-learn=1.8.0
  - xgboost=3.2.0
  - scipy=1.17.1
  - statsmodels=0.14.6
  # only for linux with cuda
  - cuml=26.04
  - cuda-version=12.9
  - pip=26.0.1
  - pip:
      - torch==2.11.0 --index-url https://download.pytorch.org/whl/cu124

  # ── Data I/O ─────────────────────────────────────────────────────────────
  - polars=1.39.3
  - pyarrow=23.0.1

  # ── Utilities ────────────────────────────────────────────────────────────
  - tqdm=4.67.3
  - wandb=0.25.1

  # ── Testing ──────────────────────────────────────────────────────────────
  - pytest=9.0.2
