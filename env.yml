name: ihec-as
channels:
  - conda-forge
  - bioconda
  - rapidsai-nightly
dependencies:
  # ── Bioinformatics tools ─────────────────────────────────────────────────
  - suppa=2.3
  - samtools=1.23.1
  - ucsc-bigwigaverageoverbed=482
  - maxentscan=0_2004.04.21

  # ── Runtime ──────────────────────────────────────────────────────────────
  - python=3.11
  - ca-certificates=2026.2.25
  - openssl=3.6.1

  # ── ML / data science ────────────────────────────────────────────────────
  - numpy=2.4.3
  - scikit-learn=1.8.0
  - py-xgboost=3.2.0=cuda12*
  - scipy=1.16.3
  - statsmodels=0.14.6
  - optuna-integration=4.8.0
  # only for linux with cuda
  - cuml=26.04
  - cuda-version=12.9
  - pip=26.0.1
  - pip:
      # IMPORTANT (GPU setup): pip torch installs CUDA wheels that shadow RAPIDS/cuML
      # conda CUDA libraries. After `mamba env create -f env.yml`, run:
      #   mamba run -n ihec-as python -m pip uninstall -y \
      #     nvidia-cublas-cu12 nvidia-nvjitlink-cu12 nvidia-cusparse-cu12
      - torch==2.7.0 --index-url https://download.pytorch.org/whl/cu128
      - tabicl==2.0.3

  # ── Data I/O ─────────────────────────────────────────────────────────────
  - polars=1.39.3
  - pyarrow=23.0.1

  # ── Utilities ────────────────────────────────────────────────────────────
  - tqdm=4.67.3
  - wandb=0.25.1

  # ── Testing ──────────────────────────────────────────────────────────────
  - pytest=9.0.2
