name: ihec-as-cpu
channels:
  - conda-forge
  - bioconda
dependencies:
  # ── Bioinformatics tools ─────────────────────────────────────────────────
  - suppa=2.3
  - samtools=1.23.1
  - ucsc-bigwigaverageoverbed=482
  - maxentscan=0_2004.04.21

  # ── Runtime ──────────────────────────────────────────────────────────────
  - python=3.11
  - ca-certificates=2026.2.25
  - openssl=3.6.1

  # ── ML / data science (CPU) ─────────────────────────────────────────────
  - numpy=2.4.3
  - scikit-learn=1.8.0
  - py-xgboost=3.2.0
  - shap=0.51.0=cpu_py311*
  - scipy=1.16.3
  - statsmodels=0.14.6
  - pip=26.0.1
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.7.0+cpu
      # pangolin splice site scorer (Zeng & Li 2022) — NOT the COVID lineage tool
      - git+https://github.com/tkzeng/Pangolin.git@5cf94b8db938c658391b4305cd7ce33297d44ff7

  # ── Data I/O ─────────────────────────────────────────────────────────────
  - polars=1.39.3
  - pyarrow=23.0.1
  - pyfastx=2.3.0

  # ── Utilities ────────────────────────────────────────────────────────────
  - tqdm=4.67.3
  - wandb=0.25.1

  # ── Testing ──────────────────────────────────────────────────────────────
  - pytest=9.0.2

  # ── Workflow ─────────────────────────────────────────────────────────────
  - snakemake=9.21.0
  - snakemake-executor-plugin-cluster-generic=1.0.9
  - snakemake-executor-plugin-slurm=2.7.1
