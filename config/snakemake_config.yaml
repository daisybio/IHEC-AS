# Snakemake pipeline configuration for IHEC-AS
# Run from project root: mamba run -n ihec-as snakemake --profile profiles/slurm

# ── Wildcards ─────────────────────────────────────────────────────────────────
# all_transcript_filters = the UNIVERSE of valid filters (drives wildcard
# constraints, so any of these is still buildable by an explicit target /
# --config override). transcript_filters = the DEFAULT build set that `rule all`
# and the ML config space expand over. Default is biotype_filtered only; add
# the others here (or request their targets directly) to build them.
all_transcript_filters:
  - transcripts
  - tsl_filtered
  - biotype_filtered

transcript_filters:
  - biotype_filtered

# Primary filter used for main analyses (09-2, 10)
primary_filter: biotype_filtered

# Pangolin device. true = GPU (default). CPU is technically supported but
# IMPRACTICAL here: the 12-model CNN over 10,001bp windows runs ~1000s/batch on
# CPU -> ~36h for 127k sites (measured). GPU does it in minutes, so even a long
# a40 queue wait wins. Force CPU (only if you must) WITHOUT editing this file:
#   snakemake --config pangolin_use_gpu=false ...
# The Snakefile derives pangolin_scores gpu/threads/batch-size from this.
pangolin_use_gpu: true
# Pangolin GPU gres + env. Default: the idle gpu01 titans via the pangolin-titan
# env (torch cu121 2.4.1, which keeps sm_70 = Titan V — verified: kernel runs).
# The main ihec-as torch (cu128) dropped those archs, so it needs the a40s (which
# are heavily contended). NOTE: cu121's arch list lacks sm_61, so the 1 Titan Xp
# on gpu01 would fail; the 2 Titan V's work. To use the a40 instead:
#   --config pangolin_gpu_gres=gpu:a40:1 pangolin_env=ihec-as
# pangolin_gpu_gres: "gpu:titan:1"
# pangolin_env: "pangolin-titan"

# W&B tracking for splicing_ml/splicing_ml_ablation rules. Default flipped
# ON 2026-07-16 after a design review confirmed the tracker's design/plots
# are sound (found + fixed 2 real issues first: a delete-vs-still-running
# race in _delete_existing_run, and the ranking/by_* charts blending RI+SE
# into one misleading mean -- both fixed in wandb_tracker.py before this
# flip). Requires `wandb login` to have been run once already on this node
# (stored credentials, e.g. ~/.netrc) -- the rule itself also runs
# `wandb login` to load them into the job env, same as the old
# scripts/slurm_ml_one_config.sh did. Disable per-invocation without editing
# this file: `snakemake --config wandb_enabled=false ...`.
wandb_enabled: true
wandb_project: "splicing-ml"
wandb_no_require_auth: false

event_types:
  - SE
  - RI

variabilities:
  - High
  - Low
  - both

group_cols:
  - seqnames
  - ontology

# Tasks built by `rule all`. Regression removed from the default 2026-08-01 per user
# request -- nothing downstream consumes it (07-2's comparison plot reads only
# *_results_classification.json.gz for both the main and ablation batteries), and the
# per-task rules stay available, so a regression target can still be requested
# explicitly or re-enabled by adding it back here.
ml_tasks:
  - classification

# Ablation battery axes, deliberately NARROWER than the main battery above.
# Restricted 2026-08-01 to the full dataset only: the battery answers
# "sequence-only vs epigenetics-only", which does not need the High/Low split, and
# 2 groups x 2 event types x 3 strata x 2 tasks = 24 jobs was mostly redundant.
# group_col is not an axis here at all -- the ablation output paths hardcode
# `seqnames`, since `ontology` grouping leaks event identity and its numbers are not
# usable as generalisation performance.
ablation_variabilities:
  - both

# Max outer-test rows per fold fed to SHAP TreeExplainer/LinearExplainer.
# Raised 50000 -> 100000 for the production run (2026-08-01). Cost is LINEAR in rows:
# real logs measured TreeExplainer at 5,000 rows costing 0.4-144 s per fold at SE
# scale, so 200,000 extrapolates to roughly 16 s - 1.6 h per fold worst case -- still
# under xgb/lgbm's own 60-200+ min search per fold, which is the bar that matters.
# RI test folds are well below this cap, so RI is effectively exhaustive already; the
# cap only binds on SE (2-4M rows/fold), where it lifts the sample from ~1-2% to ~5-10%.
# Set to 0 for a truly exhaustive run -- but note that is 40-80x the current SE cost
# and was measured at 2+ hours per fold with no progress output before subsampling
# existed. Only per-sample SHAP values need it; feature rankings do not.
shap_max_samples: 100000

# biotype_filtered + both was previously excluded here (see original SLURM
# config exclusion) -- re-enabled 2026-07-17 per user request. This makes the
# splicing_ml_L resource tier (SE + both) reachable for the first time; RI +
# both now also runs, routed to splicing_ml_M (see resources below).
exclude_ml_configs: []

# ── Paths ─────────────────────────────────────────────────────────────────────
# (Removed rmats_filtered_dir / gencode_gtf_dir / wgbs_bed_dir 2026-07-06: all
# three were unused dead config — no rule/script referenced them, and their
# comment was stale. gencode.v29.{tf}.gtf and rmats/{tf}/event_{et}.psi are
# rule-produced (02-1 / 02-3) with hardcoded "splicing_analysis" paths; WGBS
# reads the external wgbs_matrices_data_dir from .Rprofile and writes
# sample_dts/WGBS_agg_{tf}.csv.gz — nothing used processed_data/wgbs_beds.)

# Output root for ML results
ml_output_root: "splicing_ml/output"

# ── Resources (SLURM) ─────────────────────────────────────────────────────────
# mem_mb, runtime (minutes), threads, gpu (0/1)
resources:
  gather_data:
    mem_mb: 8000
    runtime: 60
    threads: 2
    gpu: 0
  transcript_filters:
    mem_mb:
      48000 # load-isoform-quants now reads only the ~441 rna_to_use
      # cohort (not the ~1555 full pool that OOM-killed job
      # 6280493 at 48G), so this is comfortable again.
    runtime: 120
    threads: 4
    gpu: 0
  rmats_event_filtering:
    mem_mb:
      96000 # SE cohort JC table (~66M rows = ~150k events x 441 samples) is
      # inherently large. MaxRSS climbed 49G(@48G cap)->61G(@64G cap) —
      # both OOM, so real need is ~65G+, driven by the build's triple
      # copy (dt_list + long_dt_list + event_sample_data), NOT fork
      # count (mc.cores 8->4 didn't lower it). rm()+gc() now free each
      # copy as consumed; 96G (= rnaseq tier) gives margin. keep= +
      # 4 JC-read forks (EpiATLAS_AS_RMATS_JC_CORES) still apply.
    runtime: 180
    threads: 8
    gpu: 0
  prepare_aggregation:
    mem_mb: 64000
    runtime: 360
    # per-filter: event-loading now parallelises over event types (SE/RI, ~2
    # cores) + data.table threads; the old 8 was sized for a cross-filter
    # mclapply that no longer exists per job. 4 = 2 event-type forks + headroom.
    threads: 4
    gpu: 0
  maxentscan_scores:
    mem_mb: 4000
    runtime: 60
    threads: 1
    gpu: 0
  pangolin_scores:
    mem_mb:
      48000 # host RAM. n_workers(=threads) each encode one-hot batches
      # (10001bp x 4) + on CPU the model activations live in host RAM
      # too. 16 workers x batch 4096 OOM'd at 16G (killed at batch 0).
      # 48G covers 16 workers at the reduced batch (see --batch-size).
    runtime:
      300 # ~106k events / ~300-400k sites. Per-site encoding is CPU-bound
      # and parallelised over SLURM_CPUS_PER_TASK (n_workers). CPU run
      # ~40min-2hr; 300min buffer.
    # CPU, not GPU: the a40 queue is heavily contended (indefinite Priority wait),
    # and the script auto-falls back to CPU (torch.cuda.is_available()). Routing to
    # shared-cpu + more threads (encoding scales with cores) starts sooner and
    # finishes in ~1-2hr. Flip gpu:1 + threads:4 to go back to GPU if the queue frees.
    threads: 16
    gpu: 0
  aggregate_chip_one:
    mem_mb:
      10000 # bigWigAverageOverBed loads the whole pval bigwig; OOM-Killed
      # at 500M. The old standalone 04-2-aggregate-ChIP.sh used 10G.
    runtime:
      60 # bumped from 15 (2026-07-15): 3 jobs on 1.6-2GB bigwigs hit the 15min
      # wall — 2 TIMEOUT-killed, 1 finished at 14:51/15:01 (no margin). NFS I/O
      # bound, not compute — sacct showed runtime, not OOM. Matches the old
      # standalone 04-2-aggregate-ChIP.sh array job's `-t 0-1:00:00` (same tool,
      # same 10G mem) — that reference value is 60min, not 15 or 30.
    threads: 1
    gpu: 0
  aggregate_chip:
    mem_mb: 500 # sentinel rule — negligible; kept for R() compatibility
    runtime: 5
    threads: 1
    gpu: 0
  chip_signal_sanity:
    mem_mb:
      16000 # §4.13b QC: streams each chip_agg tab once (never the full
      # long table); one-file columns + one-mark accumulator only.
    runtime:
      300 # ~3 sequential passes over all 2430 tabs (per-file summary,
      # window accumulation, stratified axis test) — single-threaded,
      # TIMED OUT at 90 (reached 18/22). 300 covers the full render.
    threads: 1
    gpu: 0
  aggregate_wgbs:
    mem_mb:
      96000 # big chromosomes peak ~48G in ONE fork (chr1: 1.15M in-window
      # CpGs x 645 samples; melt+merge+copies). 4 forks -> ~100G, 2
      # forks -> 97G (both OOM at 96G). mc.cores=1 (EpiATLAS_AS_WGBS_CORES,
      # serial) -> ~48G peak, ~2x margin under 96G.
    runtime: 180
    threads: 8
    gpu: 0
  rnaseq_normalisation:
    mem_mb: 96000 # per-filter Snakemake job; single filter's count/getmm/vst matrices.
    runtime:
      120 # dominant cost is the data.table fread+aggregation of the ~88M-row
      # isoform subset (scales with threads + capped OpenBLAS); DESeq2 vst()
      # itself runs SERIALLY (no BPPARAM path) but is the fast-wrapper.
      # Cross-filter parallelism = separate Snakemake jobs.
    threads: 8
    gpu: 0
  rbp_binding_sites:
    mem_mb: 32000 # data/human.txt.gz ~38M rows loaded once via fread+GRanges. step 18/20 [rbp-expression-features] Step 2a used to OOM here (32.6G MaxRSS at 32G): the rbp_name join fanned out to event x sample x RBP (100s of M rows) before the by=(ID,uuid) collapse. Now chunked over event batches (~1/n_chunks peak) + slimmed to 3 cols -> peak well under 32000.
    runtime: 120
    threads: 1
    gpu: 0
  irfinder_concordance:
    mem_mb: 24000 # bumped 8000->24000 2026-07-15: real run OOM-killed at 8000 (7 oom_kill events,
      # SLURM jobid 6325961) despite the R log showing a clean completion -- the kill landed on a
      # forked pbmclapply worker after the main process's visible work finished. Old 8000 estimate
      # ("~1GB RSS") predates whatever grew event_RI.psi/event_RI.jc.csv.gz since, and didn't
      # account for fork-multiplied memory across parallel workers. 24000 = 3x headroom given the
      # remaining 2-way forking (see threads note below); not independently re-measured yet.
    runtime: 60 # runs BOTH annotation + TSL12 trees (415 files read twice) - real run ~ a few minutes locally, doubled + buffer for slower cluster I/O.
    threads: 2 # lowered 8->2 2026-07-15: the "matches min(8L, mc.cores)" claim was already wrong --
      # nothing in this pipeline sets options(mc.cores=), so the Rmd's pbmclapply always used its
      # getOption() fallback (4L) regardless of this value. Lowered the Rmd's fallback to 2L (see
      # 02-4-irfinder-concordance.Rmd) to actually cut fork-multiplied memory, and lowered this to
      # match reality instead of over-reserving unused cores.
    gpu: 0
  create_aggregated_dt:
    mem_mb:
      128000 # histone_dt = 2430 ChIP tabs x ~424k windows ~= 1e9-row long
      # table (~30G) + WGBS/feature joins + the dcast to wide (rbind + tstrsplit
      # + dcast all hold copies at chunk 4 build-aggregated-dt). OOM'd at 32G
      # (mcmapply forks: "names[2430] vs vector[608]") then AGAIN at 96G
      # (98.2G MaxRSS, real full-scale run 2026-07-09) — the 96G was an
      # untested estimate. 128G gives headroom over the measured 98G peak.
    runtime: 90
    threads: 4
    gpu: 0
  correlation:
    mem_mb:
      180000 # bumped 48000->96000->180000 (2026-07-15): OOM-killed TWICE --
      # first at 48000 (job 6329894, 5 oom_kill events), then again at 96000
      # (job 6329989, MaxRSS 93.68G, right at the cap). compute_all_cor's
      # pbmclapply forks (10) multiply memory via R's fork-COW-breaking GC,
      # roughly linear in fork count over a large base object -- 96000
      # clearly wasn't real headroom, not just an off-by-a-little. Primary
      # fix is cutting forks 10->4 (06-correlation.Rmd mc.cores, chosen for
      # memory safety, not to match a thread count); mem_mb kept generous as
      # a hedge since the linear-scaling model is inferred, not measured.
      # profile's restart-times:0 means the Snakefile's attempt-scaling
      # multiplier never fires on a manual rerun, so the base value itself
      # must be high enough for attempt=1.
    runtime: 180
    threads: 4 # matches mc.cores=4 in 06-correlation.Rmd (was 8, oversized
      # once the fork count itself was cut for memory safety -- no reason to
      # reserve SLURM CPUs the script won't fork into).
    gpu: 0
  feature_pca_sanity:
    mem_mb: 48000 # reads the full aggregated_dt_filtered_{tf}.csv.gz (~2.2G/9M rows)
    # once, then runs rsvd PCA + UMAP (up to ~10 fits: feature-gallery ET x
    # Variability incl "Both", + PSI sample/event embeddings) on ~100k-row
    # downsampled subsets per stratum -- same order of magnitude as `correlation`.
    runtime: 180
    threads: 8 # UMAP itself hardcodes n_threads=2L; extra threads help the
    # CSV read + rsvd/data.table ops, not UMAP directly.
    gpu: 0
  ml_global_comparison:
    mem_mb: 8000 # only reads small per-fold JSON summaries (fold_results, no
    # aggregated_dt), builds one ggplot -- an order of magnitude lighter than
    # feature_pca_sanity/correlation above.
    runtime: 30
    threads: 1
    gpu: 0
  splicing_ml_S: # RI + High/Low
    mem_mb: 32000
    runtime: 360
    threads: 8
    gpu: 1
  splicing_ml_M: # SE + High/Low | RI + both
    mem_mb:
      128000 # bumped from 64000 (2026-07-17): job SE_biotype_filtered_Low_seqnames
      # was silently SIGKILLed (host-RAM cgroup OOM, no traceback) right as it moved
      # from TabICL to fitting `linear` -- real log shows TabICL's tf_col array at
      # this fold's scale (seq_len=4010018) needed an "Output size: 174.00GB",
      # disk-offloaded because both GPU and CPU were already "tight"; the leftover
      # host-RAM footprint plus the 4M-row dataframe pushed past 64GB. `exclude_ml_configs`
      # currently excludes ALL "both"-variability configs (only `biotype_filtered`
      # transcript_filter is active, and that's the one excluded pair) -- so "RI + both"
      # never runs either, and this tier in practice only ever serves "SE + High/Low",
      # which the splicing_ml_L comment below already admits is comparable in row-scale
      # ("2.5-4M/fold") to "SE + both" -- matching its 128000 mem_mb directly rather than
      # guessing a smaller number.
    runtime:
      5760 # bumped from 720 (2026-07-16): job 6329948 (SE/Low/ontology) TIMED
      # OUT at 12h -- real log shows outer_splits=5, models=['lgbm','tabicl',
      # 'xgb','linear'] (4 now that lgbm's a default), fold 1 alone
      # (train_n=2.5M) took 9h44m, fold 2 (train_n=4M) was still 2h11m in when
      # killed. 5 folds at that pace is 50-60h+, nowhere near 12h -- went
      # straight to the shared-gpu partition's real ceiling (4 days = 5760min,
      # confirmed via `sinfo`) rather than another incremental guess.
    threads: 8
    gpu: 1
  splicing_ml_L: # SE + both
    mem_mb: 128000
    runtime:
      5760 # bumped from 1440 (2026-07-16), same reasoning as splicing_ml_M --
      # SE + both has even more rows than SE/Low's 2.5-4M/fold, so 1440 (24h)
      # was likely already insufficient even before lgbm's addition. Not
      # measured directly (no L-tier full run has finished with 4 models
      # yet) -- set to the partition ceiling rather than guess a number.
    threads: 12
    gpu: 1
  event_models:
    # 160000 (2026-08-04, third bump): the Phase-1 event loop then OOM'd at 93.4 GB
    # under 96000 after 164 tables (job 6433878). That loop forks over a ~28 GB parent
    # (chip_matrix 12.8 GB + aggregated_dt ~6 + grid ~4.3 + the per-(ID,uuid) sources)
    # and each worker's GC dirties parent pages, so the cost is ~(parent) x (workers).
    # The real fix is the fork width -- 09-1 now caps Phase 1 at 8 (EPIATLAS_AS_BUILD_CORES)
    # and frees psi_long_dt/event_annotations_dt/event_gr/activeChromHMM before forking --
    # this is headroom on top. Nodes on shared-cpu carry 384 GB (one has 1 TB) and 05
    # already runs at 128000, so this is not a scheduling risk.
    #
    # History, because the pattern matters -- three OOMs, and raising memory fixed none
    # of them; the code shapes did:
    #   64000 -> OOM at 62.3 GB (job 6433872). Peak was the chip_matrix rebuild, and it
    #            was intrinsic: `all_cols` is 2,430 tabs x ~709k regions x 8 B = 12.8 GB
    #            (matches the cache on disk) and `do.call(cbind, ...)` transiently
    #            doubled it, with mclapply shipping the whole list back through
    #            serialization pipes. FIX: batched fill (09-1), not more memory.
    #   96000 -> OOM at 93.6 GB (job 6433873), same cause: it grows to fill whatever it
    #            is given, so the bump bought one extra minute of runtime.
    #   96000 -> OOM at 93.4 GB (job 6433878), DIFFERENT cause: the Phase-1 event loop
    #            forking over a ~28 GB parent. FIX: fork width 16 -> 8 + freeing
    #            psi_long_dt/event_annotations_dt/event_gr/activeChromHMM before the fork.
    # 160000 then completed at MaxRSS 156.1 GB (job 6433879, 3h37) -- i.e. the full build
    # genuinely needs this much, it is NOT over-provisioned. A SKIP-ONLY re-run (all
    # tables present) peaks far lower: 75.1 GB measured (job 6434908, 8m22), so an
    # idempotent re-run can be given ~80000 via --set-resources.
    mem_mb: 160000
    runtime: 1440
    threads: 16
    gpu: 0
  # Tier-1 ridge screen: ONE job per event, ~34,146 of them. Split out of `analysis`
  # (which it shared with screen_aggregate / ml_analysis / experimental_events, none of
  # them measured) because it is the only rule in that tier whose reservation limits how
  # many can co-reside -- 32000 x 50 concurrent reserves 1.6 TB against ~2.05 TB free,
  # so the screen was crowding itself out for no reason.
  #
  # mem_mb 12000. NOTE the 50 production jobs that OOM'd at 4000 reported MaxRSS
  # 3.65-3.75 GB, but that is the CAP, not the requirement -- an OOM-killed job's MaxRSS
  # is wherever the killer struck, so all it establishes is "> 3.9 GB". Estimating from
  # the parts instead: parent ~0.8 GB (R + packages + the 17 MB session + psi_table) plus
  # 4 forks at ~1.4 GB each (the /usr/bin/time single-process figure) =~ 6.4 GB. 12000 is
  # ~1.9x that estimate; it still reserves only 600 GB per 50 concurrent against
  # `analysis`'s 1.6 TB, so there is no reason to shave it closer.
  # Once real COMPLETED jobs exist, re-read `sacct MaxRSS` and tighten from data.
  #
  # 4000 was tried first and ALL 50 JOBS OOM'd (2026-08-05). The mistake was a
  # metric mismatch, and it is an easy one to repeat: sandbox timings via
  # `/usr/bin/time -f %M` gave 1.29-1.51 GB across four events spanning the shape space
  # (10000: 391 obs x 2,494 cols; 3883: 245 x 4,539, largest table on disk; 63040: RI at
  # R=818; 42006: 413 x ~4,400, max of that product). But %M is the max RSS of a SINGLE
  # PROCESS -- the largest fork -- whereas SLURM's cgroup sums the parent plus all 4
  # pbmclapply forks, ~2.5x more. ALWAYS size mem_mb from `sacct MaxRSS`, never from
  # /usr/bin/time on a forking script.
  #
  # Peak does NOT scale with the rotation count (RI at R=818 is no heavier than SE at
  # R=200): controls are processed 4-at-a-time regardless, so R changes runtime, not
  # footprint. It also barely tracks n_observed x n_features -- flat across a 3.4x spread
  # in that product -- because most of it is fixed overhead (R + packages + the 17 MB
  # session + the forks' baseline) rather than data.
  #
  # runtime 45 (CORRECTED 2026-08-05, same day it was set to 240 -- that was wrong).
  # Measured wall: 166 s (SE R=200), 453 s (RI R=818), 588 s (42006, worst of the four),
  # so 45 min keeps ~4.6x margin over the measured tail.
  #
  # Why 240 was wrong: it was chosen on truncation-safety grounds alone, ignoring
  # schedulability -- and schedulability turned out to be the binding constraint. With
  # 4:00:00 requested, all 50 jobs sat (Priority) behind another user's 40 running + 12
  # queued jobs and SLURM projected the FIRST start 5-10 h out, while 558 CPUs and ~2 TB
  # sat idle. Backfill starts a lower-priority job early only if it provably finishes
  # before the blocking job's projected start, so a 4-hour request cannot fit a ~1-hour
  # window whereas a 45-minute one can.
  #
  # The asymmetry that decides it: a truncated job costs ONE event, recomputed on the
  # next invocation (per-event idempotency + the stat_version gate discard stale rows),
  # whereas an over-long request costs the ENTIRE run sitting in a queue for hours.
  # If events ever do start hitting the wall, raise this -- do not raise it pre-emptively.
  event_screen:
    mem_mb: 12000
    runtime: 45
    threads: 4
    gpu: 0
  analysis:
    mem_mb: 32000
    runtime: 240
    threads: 4
    gpu: 0
  # Full-atlas rebuild (rule atlas_build_full, step 02-3c). Its own tier because it is the only rule
  # that reads the raw rMATS tree and reassembles all 1,522 samples: SE alone is 559,157 events x
  # 1,522 samples = ~851 M rows. Sized for `exbio-interactive` (160 CPUs / 1.5 TB / 1-day cap), which
  # is why runtime is 1440 and not more -- the partition will not grant longer. The job is resumable
  # per (event type, run), so hitting the cap costs only the run in flight.
  atlas_build:
    mem_mb: 200000
    runtime: 1440
    threads: 8
    gpu: 0

# ── SLURM partitions ──────────────────────────────────────────────────────────
slurm_cpu_partition: "shared-cpu"
# Big-memory partition for the full-atlas rebuild only. Set on that rule directly rather than through
# _partition(), which is a cpu/gpu binary -- routing it through there would change the partition of
# every other CPU rule.
slurm_atlas_partition: "exbio-interactive"
slurm_gpu_partition: "shared-gpu"
slurm_gpu_gres: "gpu:a40:1"
slurm_gpu_qos: "limitgpus"
slurm_gpu_exclude: "compms-gpu-1.exbio.wzw.tum.de"

# ── Permuted-groups negative control (rule permuted_groups_control, step 09p) ──
# Events sampled per (Event Type x feature space) for the Tier-1 permuted-groups control. 100 is
# the size the reported result was measured at (2026-08-28); the pilot used 12, and re-running the
# stage at the pilot value would silently downgrade a published number. Passed as a rule PARAM, so
# changing it invalidates the result rather than leaving a stale one at the old n.
permuted_groups_n_events: 100

# ── Manuscript figure sync (rule sync_paper_figures, step 11b) ────────────────
# Target for publication figures produced by 11-paper-figures.Rmd. The rule writes into
# <manuscript_images_dir>/generated/ and NEVER into images/ directly: everything already in
# images/ dates from Jul-Aug 2024 and is the preprint's figure record (the version submitted to
# Genome Biology). Overwriting e.g. varImp.pdf would also destroy the before/after that the
# preprint-leak figure needs. The sync rule is deliberately OUTSIDE `rule all` -- this is an
# Overleaf-synced git repo and must not be written to as a side effect of a pipeline run.
manuscript_images_dir: "/nfs/proj/quirinmanz/65f465a3da21f80541769df9/images"
